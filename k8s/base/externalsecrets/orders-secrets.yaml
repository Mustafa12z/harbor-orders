apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: orders-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .postgres }}"
        JWT_SECRET: "{{ .jwt }}"
        DATABASE_URL: "postgres://app:{{ .postgres }}@postgres:5432/orders?sslmode=disable"
  data:
    # remoteRef.key values are patched per env (orders-*-postgres-password).
    - secretKey: postgres
      remoteRef:
        key: orders-postgres-password
    - secretKey: jwt
      remoteRef:
        key: orders-jwt-secret
