apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-deployment-marker
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marker
          image: mirror.gcr.io/curlimages/curl:8.10.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: api_token
                  optional: true
            - name: GRAFANA_INSTANCE
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: instance_id
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "${GRAFANA_TOKEN:-}" ]; then
                echo "No grafana-cloud secret; skipping deployment marker"
                exit 0
              fi
              # Posts a Grafana annotation for correlation with SLO dashboards.
              # Adjust org/host if your stack differs.
              curl -fsS -X POST \
                -u "${GRAFANA_INSTANCE}:${GRAFANA_TOKEN}" \
                -H 'Content-Type: application/json' \
                -d "{\"text\":\"Argo sync $(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"tags\":[\"deploy\",\"harbor-orders\"]}" \
                "https://grafana.com/api/annotations" || echo "annotation post failed (non-fatal)"
