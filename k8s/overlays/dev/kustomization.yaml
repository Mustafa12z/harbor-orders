  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/scheduler
    digest: sha256:da7fabd08da281ef95f35de9bdc9a58646533799a1cc7ae39646f0fd9192c20a
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/dashboard-api
    digest: sha256:d8f6919a898378f48eb07a9093b1b0cbe69802f464e4f57fc51191bd9b13832c

replacements:
  - source:
      kind: ConfigMap
      name: rollout-env
      fieldPath: data.environment
    targets:
      - select:
          kind: Rollout
        fieldPaths:
          - spec.strategy.canary.steps.*.analysis.args.[name=environment].value
        options:
          create: false
