  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/scheduler
    digest: sha256:95117cc82758b50c24d7158daa94980e22dd97282bd421deed450ff8fa09d867
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/dashboard-api
    digest: sha256:15415b0de4779d7c4ee0b268cc6d31eba28aa3f2f8e2082c4b17d7d1df86b8f1

replacements:
  - source:
      kind: ConfigMap
      name: rollout-env
      fieldPath: data.environment
    targets:
      - select:
          kind: Rollout
        fieldPaths:
          - spec.strategy.canary.steps.*.analysis.args.[name=environment].value
        options:
          create: false
