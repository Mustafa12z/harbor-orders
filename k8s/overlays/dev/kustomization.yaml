apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - env-value.yaml
  - ../../base
  - ingress.yaml
  - managed-certificate.yaml
  - ../../base/observability
  - ../../base/externalsecrets
  - ../../base/hooks
  - ../../rollouts

patches:
  - path: hpa-patch.yaml
  - path: sa-annotations.yaml
  - path: eso-patch.yaml
  - path: config-patch.yaml

# Pin by digest once app-ci has built images. Until then, :bootstrap is pushed
# by infra-ci (after Terraform, before Argo). See docs/versioning.md.
images:
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/api-gateway
    digest: sha256:7ee7883f7fca57bd17a993ed89eceba5503ad7825917177480c8df261181e558
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/order-service
    digest: sha256:d8e36c314c647ca012522ccb958d2ca027518ee2d99a1aa04eac3744c887ca6f
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/inventory-service
    digest: sha256:b580928b259553e9945258e4429fc19cb371d01e5a63d6d0b8e67f2cd320f570
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/payment-service
    digest: sha256:4adf3a3bd8babdab6482364fb1649e77feed220e9045031f4de49f2e60853d0c
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/notification-service
    digest: sha256:251957545ef35a63859ae39ee69f790557d16865e758185591677fd7e7a10444
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/shipping-service
    digest: sha256:3c425aed32bd1bffb6f2caacc2df3758aeb3cd4c25766e96989c6e386c53d34c
  - name: europe-west2-docker.pkg.dev/gke-project-503215/gke-orders/worker
