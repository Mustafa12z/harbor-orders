apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orders-tls
  namespace: orders
  annotations:
    # Issue after workloads; never block Rollout sync waves.
    argocd.argoproj.io/sync-wave: "10"
spec:
  secretName: orders-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dev.order.mustafamirreh.com
