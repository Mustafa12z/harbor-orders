apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-orders-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: harbor-orders
  source:
    repoURL: git@github.com:Mustafa12z/gke-microservices.git
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: orders
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Avoid ServerSideApply until Argo's static schema matches GKE (see Argo FAQ
      # "field not declared in schema" / terminatingReplicas on K8s 1.35).
      - RespectIgnoreDifferences=true
