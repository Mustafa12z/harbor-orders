# ClusterIssuer + Route53 credentials (ESO). Applied after cert-manager CRDs exist.
# Bootstrap script and/or Argo Application cert-manager-config sync this path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: cert-manager
  annotations:
    iam.gke.io/gcp-service-account: orders-eso@gke-project-503215.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: cert-manager
spec:
  provider:
    gcpsm:
      projectID: gke-project-503215
      auth:
        workloadIdentity:
          clusterLocation: europe-west2
          clusterName: dev
          clusterProjectID: gke-project-503215
          serviceAccountRef:
            name: secret-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: route53-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: orders-cert-manager-route53
        property: access_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: orders-cert-manager-route53
        property: secret_access_key
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: mustafa.mirreh10@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: eu-west-2
            hostedZoneID: Z07782661B5WKHOHAEPWD
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
