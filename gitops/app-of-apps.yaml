apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-orders-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Mustafa12z/gke-microservices.git
    targetRevision: HEAD
    path: gitops
    directory:
      recurse: true
      include: "{appproject.yaml,applications/*.yaml,bootstrap/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
