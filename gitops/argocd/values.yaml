# Shared Argo CD Helm values. Env overlays set configs.cm.url + dex redirectURI.
# Chart version is pinned in scripts/bootstrap-argocd.sh.

crds:
  install: true

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: "true"
  # Placeholders so Dex can start before ESO merges real Google OAuth from GSM.
  secret:
    extra:
      dex.google.clientID: "replace-me"
      dex.google.clientSecret: "replace-me"
  rbac:
    policy.default: ""
    policy.csv: |
      g, mustafa.mirreh10@gmail.com, role:admin

server:
  insecure: true
  service:
    type: ClusterIP
    annotations:
      cloud.google.com/backend-config: '{"default":"argocd-server"}'
      cloud.google.com/neg: '{"ingress":true}'

dex:
  enabled: true

redis:
  enabled: true
