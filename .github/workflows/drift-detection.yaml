name: drift-detection

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.9.8"

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dev-only while the deploy path is scoped to a single environment.
        env: [dev]
    environment: ${{ matrix.env }}-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: ./.github/actions/setup-gcp
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_TF_PLAN_SA }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      - name: Plan with detailed exit code
        id: plan
        uses: ./.github/actions/terraform-env
        env:
          TF_VAR_project_id: ${{ vars.TF_VAR_project_id }}
          TF_VAR_domain_name: ${{ vars.TF_VAR_domain_name }}
          TF_VAR_route53_zone_id: ${{ vars.TF_VAR_route53_zone_id }}
          TF_VAR_alert_email: ${{ vars.TF_VAR_alert_email }}
          TF_VAR_grafana_otlp_endpoint: ${{ secrets.TF_VAR_grafana_otlp_endpoint }}
          TF_VAR_grafana_instance_id: ${{ vars.TF_VAR_grafana_instance_id }}
          TF_VAR_grafana_api_token: ${{ secrets.TF_VAR_grafana_api_token }}
        with:
          environment: ${{ matrix.env }}
          command: plan
          detailed_exitcode: "true"
      - name: Open or update drift issue
        if: steps.plan.outputs.plan_exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const title = `Terraform drift detected: ${env}`;
            const body = fs.readFileSync(`terraform/environments/${env}/plan.txt`, 'utf8').slice(0, 60000);
            const marker = `<!-- drift-${env} -->`;
            const text = `${marker}\n## Drift in \`${env}\`\n\nDetected by scheduled \`terraform plan -detailed-exitcode\`.\n\n\`\`\`\n${body}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body: text, labels: ['drift'],
              });
            }
