name: bootstrap-argocd
description: Install Argo CD (Helm), ESO-synced secrets, Ingress, and env Application
inputs:
  environment:
    description: Environment name (dev, staging, prod)
    required: true
runs:
  using: composite
  steps:
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        # 3.17+ required for --take-ownership (adopt kubectl-applied Argo resources).
        version: v3.17.4
    - name: Bootstrap Argo CD
      shell: bash
      env:
        ENV: ${{ inputs.environment }}
      run: bash "${GITHUB_WORKSPACE}/scripts/bootstrap-argocd.sh" "${ENV}"
